<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Marketplace</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; }
        .grid-productos { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .producto-card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 250px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .producto-card img { max-width: 100%; height: auto; border-radius: 4px; }
        .precio { color: #27ae60; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Nuestros Productos</h1>
    
    <div style="text-align: center; margin-bottom: 30px;">
        <a href="{% url 'carrito' %}" style="background-color: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold;">🛒 Ver mi Carrito</a>
    </div>

    <div class="grid-productos">
        {% for producto in products %}
        <div class="producto-card">
            
            {% if producto.image %}
                <img src="{{ producto.image.url }}" alt="{{ producto.name }}">
            {% else %}
                <img src="https://via.placeholder.com/250" alt="Sin imagen">
            {% endif %}
            
            <h3>{{ producto.name }}</h3>
            <p class="precio">${{ producto.price }} MXN</p>
            
            <a href="{% url 'agregar_carrito' producto.id %}" class="btn-carrito" style="display: block; background-color: #007bff; color: white; padding: 10px; text-decoration: none; border-radius: 4px; box-sizing: border-box; margin-top: 10px;">Agregar al carrito</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
